name: Release

on:
  push:
    tags: ["v*"]

env:
  LEFTHOOK: "0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r "../adminkit-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: adminkit-${{ github.ref_name }}.zip
